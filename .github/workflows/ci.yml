name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MEMORY_DB_PATH: ${{ github.workspace }}/.local-memory-test/memory.sqlite3
      MEMORY_FILE_PATH: ${{ github.workspace }}/.local-memory-test/memory.jsonl
      MEMORY_EXPORT_PATH: ${{ github.workspace }}/.local-memory-test/exports/memory.md
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
