<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Shared Agent Memory</title>
  <desc id="description">Codex, Claude Code and other MCP clients share one local SQLite memory database through stdio MCP.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d192b"/>
      <stop offset="1" stop-color="#132f3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#71efc5"/>
      <stop offset="1" stop-color="#73c8ef"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a4d8e3" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1090" cy="30" r="205" fill="#71efc5" opacity=".025"/>
  <circle cx="1090" cy="30" r="145" fill="none" stroke="#71efc5" stroke-opacity=".08"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="52" y="43" width="7" height="18" rx="3" fill="#71efc5"/>
    <text x="72" y="57" font-size="13" font-weight="600" letter-spacing="2.3" fill="#a9c7d0">LOCAL MEMORY / SHARED CONTEXT</text>
    <text x="50" y="127" font-size="55" font-weight="700" letter-spacing="-1.8" fill="#f0f8fa">Shared Agent Memory</text>
    <text x="53" y="166" font-size="22" fill="#afc8d2">One local memory. Across your agents.</text>
    <rect x="52" y="196" width="475" height="2" fill="url(#accent)" opacity=".65"/>
    <g fill="#162d3b" stroke="#36515e">
      <rect x="52" y="254" width="201" height="68" rx="13"/>
      <rect x="275" y="254" width="201" height="68" rx="13"/>
      <rect x="498" y="254" width="201" height="68" rx="13"/>
    </g>
    <g font-size="19" font-weight="600" fill="#e2eff3" text-anchor="middle">
      <text x="152" y="295">Codex</text>
      <text x="375" y="295">Claude Code</text>
      <text x="598" y="295">Other MCP clients</text>
    </g>
    <g fill="none" stroke="#71efc5" stroke-opacity=".75" stroke-width="2">
      <path d="M152 322v22h596v-56h94"/>
      <path d="M375 322v22M598 322v22"/>
      <path d="m832 282 10 6-10 6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="765" y="272" font-size="12" fill="#9bbbc6">stdio MCP</text>
    <rect x="855" y="231" width="291" height="113" rx="17" fill="#163b42" stroke="#71efc5" stroke-opacity=".55"/>
    <g transform="translate(875 257)" fill="none" stroke="#71efc5" stroke-width="2">
      <ellipse cx="20" cy="8" rx="18" ry="7"/>
      <path d="M2 8v35c0 9 36 9 36 0V8M2 25c0 9 36 9 36 0"/>
    </g>
    <text x="933" y="278" font-size="22" font-weight="650" fill="#e5fff5">SQLite memory</text>
    <text x="934" y="305" font-size="14" fill="#abd0cb">Preferences + project decisions</text>
    <text x="52" y="399" font-size="13" letter-spacing="1.3" fill="#8baab7">KEYWORD SEARCH</text>
    <circle cx="231" cy="394" r="2" fill="#71efc5"/>
    <text x="251" y="399" font-size="13" letter-spacing="1.3" fill="#8baab7">VERSION HISTORY</text>
    <circle cx="425" cy="394" r="2" fill="#71efc5"/>
    <text x="445" y="399" font-size="13" letter-spacing="1.3" fill="#8baab7">MARKDOWN EXPORT</text>
    <text x="1147" y="399" text-anchor="end" font-size="13" fill="#8baab7">No cloud sync required</text>
  </g>
</svg>
